<!-- templates/includes/navbar.html -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'events:event_list' %}">
            <i class="bi bi-broadcast"></i> StreamEvents
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'event_list' %}active{% endif %}"
                       href="{% url 'events:event_list' %}">
                        <i class="bi bi-calendar-event"></i> Esdeveniments
                    </a>
                </li>

                <!-- 🔍 Búsqueda Semántica -->
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'semantic' %}active{% endif %}"
                       href="{% url 'semantic_search:semantic' %}">
                        <i class="bi bi-search"></i> Cerca Semàntica
                    </a>
                </li>

                <!-- 🤖 Assistent IA -->
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'page' %}active{% endif %}"
                       href="{% url 'assistant_chat:page' %}">
                        <i class="bi bi-robot"></i> Assistent
                    </a>
                </li>

                {% if user.is_authenticated %}
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'events:event_create' %}">
                            <i class="bi bi-plus-circle"></i> Crear
                        </a>
                    </li>
                {% endif %}
            </ul>

            <ul class="navbar-nav">
                {% if user.is_authenticated %}
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button"
                           data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-person-circle"></i> {{ user.username }}
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="{% url 'users:profile' %}">
                                <i class="bi bi-person"></i> Perfil
                            </a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <form method="post" action="{% url 'users:logout' %}" class="d-inline">
                                    {% csrf_token %}
                                    <button type="submit" class="dropdown-item">
                                        <i class="bi bi-box-arrow-right"></i> Tancar Sessió
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </li>
                {% else %}
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'users:login' %}">
                            <i class="bi bi-box-arrow-in-right"></i> Entrar
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link btn btn-outline-light ms-2" href="{% url 'users:register' %}">
                            Registrar-se
                        </a>
                    </li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>
